name: Compiler APK Mon IA

on:
  # Permet de lancer manuellement la compilation depuis l'interface GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Rendre le script Gradle exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Télécharger l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Mon-IA-APK
          path: app/build/outputs/apk/debug/*.apk
