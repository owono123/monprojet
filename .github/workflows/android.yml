name: Compilation APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Preparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK de debogage
        run: ./gradlew assembleDebug --console=plain

      - name: Renommer l'APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/ia-locale-${GITHUB_SHA::7}.apk"

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: ia-locale-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # Sur un tag v*, l'APK est joint a une Release : c'est le lien a ouvrir depuis le
      # navigateur du telephone pour l'installer.
      - name: Creer la Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.apk \
            --title "IA Locale ${GITHUB_REF_NAME}" \
            --notes "APK signe avec la cle de debogage. Active \"Sources inconnues\" sur le telephone pour l'installer."
