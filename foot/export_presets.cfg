[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Les captures de controle et les tests n'ont rien a faire dans l'APK.
exclude_filter="captures/*, tests/*"
export_path="../sortie/foot2026.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; Compilation sans Gradle : on utilise le gabarit deja compile fourni par Godot.
; Une compilation Gradle ne sert qu'a integrer des greffons Android natifs, ce
; que le jeu ne fait pas, et elle allongerait l'integration continue de
; plusieurs minutes a chaque envoi.
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
package/unique_name="com.foot2026.jeu"
package/name="Foot 2026"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=true
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
; Seules les architectures ARM : les bibliotheques x86 ne servent qu'aux
; emulateurs sur ordinateur et alourdiraient l'APK pour rien sur un telephone.
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
; Plein ecran sans barre de navigation : sur un telephone, une barre systeme au
; bord de l'ecran se declenche au moindre glissement du pouce en plein match.
screen/immersive_mode=true
screen/support_small=false
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
; Signature. Les valeurs sont remplies par l'integration continue a partir du
; fichier debug.keystore versionne avec le projet.
;
; Cette cle est volontairement fixe et publique. Godot en fabrique une nouvelle
; a chaque execution s'il n'en trouve pas, et Android refuse alors d'installer
; une mise a jour signee differemment : il faudrait desinstaller le jeu, donc
; effacer les sauvegardes, a chaque version. Le mot de passe « android » est
; celui de la cle de debogage standard : il ne protege rien et n'a pas a le
; faire, il sert seulement a garder la meme signature d'une version a l'autre.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
